worker_processes 1;
daemon off;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Temp paths writable without root
    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        server_name _;

        # SSE/event stream: must not buffer so events stream to the client
        location ~ ^/(global/event|event)$ {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400;
            chunked_transfer_encoding off;
        }

        location / {
            proxy_pass http://127.0.0.1:8100;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            # sub_filter requires buffering (default on). SSE handled above.
            proxy_buffering on;
            proxy_cache off;

            # Rewrite absolute paths to relative so requests go through HA ingress
            sub_filter_types text/html application/javascript text/css text/plain;
            sub_filter_once off;
            sub_filter 'src="/' 'src="./';
            sub_filter 'href="/' 'href="./';
            sub_filter 'url("/' 'url("./';
            sub_filter 'url(/assets/' 'url(./assets/';
            sub_filter '"/global/' '"./global/';
            sub_filter '"/assets/' '"./assets/';
            sub_filter "'/global/" "'./global/";
            sub_filter "'/assets/" "'./assets/";
            sub_filter '"/session' '"./session';
            sub_filter '"/project' '"./project';
            sub_filter '"/config' '"./config';
            sub_filter '"/provider' '"./provider';
            sub_filter '"/event"' '"./event"';
            sub_filter "'/event'" "'./event'";
            sub_filter '"/doc"' '"./doc"';
            sub_filter '"/find' '"./find';
            sub_filter '"/file' '"./file';
            sub_filter '"/command' '"./command';
            sub_filter '"/auth/' '"./auth/';
            sub_filter '"/tui/' '"./tui/';
            sub_filter '"/log' '"./log';
            sub_filter '"/lsp' '"./lsp';
            sub_filter '"/formatter' '"./formatter';
            sub_filter '"/mcp' '"./mcp';
            sub_filter '"/agent' '"./agent';
            sub_filter '"/experimental/' '"./experimental/';
            sub_filter '"/instance/' '"./instance/';
            sub_filter '"/path"' '"./path"';
            sub_filter '"/vcs"' '"./vcs"';
        }
    }
}
